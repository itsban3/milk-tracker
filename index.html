<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<script>
  try {
    var _t = localStorage.getItem('milkTracker.theme.v1');
    if (_t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0A0E17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Milk Tracker</title>
<style>
  :root{
    --bg:#0A0E17;
    --bg-grad: radial-gradient(circle at 12% -10%, rgba(111,168,220,0.16), transparent 55%),
               radial-gradient(circle at 105% 0%, rgba(232,176,75,0.12), transparent 45%), #0A0E17;
    --surface: rgba(255,255,255,0.055);
    --surface-strong: rgba(255,255,255,0.10);
    --border: rgba(255,255,255,0.11);
    --border-soft: rgba(255,255,255,0.07);
    --text:#F3F1EC;
    --text-dim:#9AA1AF;
    --text-faint:#6B7280;
    --shadow: 0 20px 50px -22px rgba(0,0,0,0.65);
    --cream:#F6EEDC;
    --gold:#E8B04B;
    --gold-strong:#F4C874;
    --dawn:#6FA8DC;
    --alert:#E1584B;
    --alert-strong:#FF6E5E;
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
    --radius-pill:999px;
    --nav-h:76px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  html[data-theme="light"]{
    --bg:#F5F6F8;
    --bg-grad: radial-gradient(circle at 12% -10%, rgba(111,168,220,0.10), transparent 55%),
               radial-gradient(circle at 105% 0%, rgba(232,176,75,0.10), transparent 45%), #F5F6F8;
    --surface: rgba(10,14,23,0.045);
    --surface-strong: rgba(10,14,23,0.075);
    --border: rgba(10,14,23,0.10);
    --border-soft: rgba(10,14,23,0.06);
    --text:#12161F;
    --text-dim:#5B6472;
    --text-faint:#8A93A3;
    --shadow: 0 20px 40px -22px rgba(20,24,35,0.22);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background: var(--bg-grad) fixed; color:var(--text);
    font-family:var(--font-body); font-size:16px; line-height:1.5;
    -webkit-tap-highlight-color:transparent; transition: background .3s var(--ease), color .3s var(--ease);
  }
  h1,h2,h3,p{ margin:0; }
  button,select,input{ font:inherit; color:inherit; }
  button{ background:none; border:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  svg{ display:block; }
  .font-num{ font-variant-numeric:tabular-nums; }
  .app{ max-width:560px; margin:0 auto; min-height:100vh; position:relative; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 20px); }
  .topbar{
    position:sticky; top:0; z-index:40; padding: calc(var(--safe-top) + 16px) 20px 14px;
    backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    background: linear-gradient(to bottom, var(--bg) 60%, transparent);
  }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-mark{ width:34px; height:34px; flex-shrink:0; color:var(--text); }
  .brand-text h1{ font-family:var(--font-display); font-size:1.12rem; font-weight:800; letter-spacing:-.02em; }
  .brand-text p{ font-size:.7rem; color:var(--text-dim); letter-spacing:.03em; margin-top:1px; }
  .top-right-actions{ display:flex; gap:8px; align-items:center; }
  .user-badge-btn{
    display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:var(--radius-pill);
    background:var(--surface); border:1px solid var(--border); font-size:.75rem; font-weight:700; color:var(--gold);
  }
  .icon-btn{
    width:42px; height:42px; border-radius:14px; flex-shrink:0; background:var(--surface);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text);
  }
  .greeting-row{ margin-top:16px; display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
  .greeting h2{ font-family:var(--font-display); font-size:clamp(1.25rem,4.5vw,1.55rem); font-weight:800; letter-spacing:-.02em; }
  .greeting p{ color:var(--text-dim); font-size:.82rem; margin-top:3px; }
  .day-pill{
    font-family:var(--font-mono); font-size:.68rem; color:var(--text-dim);
    background:var(--surface); border:1px solid var(--border-soft); padding:6px 11px; border-radius:var(--radius-pill);
  }
  main{ padding: 18px 20px 8px; }
  .view{ display:none; }
  .view.active{ display:block; animation: fadeSlideIn .4s var(--ease); }
  @keyframes fadeSlideIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
  section + section{ margin-top:24px; }
  .section-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .section-head h3{ font-family:var(--font-display); font-size:.76rem; text-transform:uppercase; letter-spacing:.11em; color:var(--text-dim); font-weight:700; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); box-shadow: var(--shadow);
  }
  
  /* Yield Counter Banner */
  .yield-banner{
    display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-radius:var(--radius-md);
    background:var(--surface); border:1px solid var(--border); margin-bottom:20px;
  }
  .yield-banner.maxed{ border-color:rgba(225,88,75,.40); background:rgba(225,88,75,.12); }
  .yield-text h4{ font-weight:800; font-size:.95rem; }
  .yield-text p{ font-size:.78rem; color:var(--text-dim); margin-top:2px; }
  .yield-pill{
    font-family:var(--font-mono); font-weight:800; font-size:.85rem; padding:6px 14px;
    border-radius:var(--radius-pill); background:var(--gold); color:#241a08;
  }
  .yield-banner.maxed .yield-pill{ background:var(--alert); color:#fff; }

  /* Scrollable Window Box for Main Page */
  .scroll-window-card{ padding:8px 0; border-radius:var(--radius-md); overflow:hidden; }
  .recipients-scroll-box{ max-height:380px; overflow-y:auto; padding:0 12px; }
  .recipient-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px;
    border-bottom:1px solid var(--border-soft); transition:background .2s;
  }
  .recipient-row:last-child{ border-bottom:none; }
  .recipient-info{ flex:1; min-width:0; }
  .recipient-name-line{ display:flex; align-items:center; gap:8px; }
  .recipient-name{ font-weight:700; font-size:.92rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rec-badge{ font-size:.6rem; font-weight:800; text-transform:uppercase; padding:2px 6px; border-radius:4px; background:rgba(232,176,75,.2); color:var(--gold); }
  .recipient-meta{ font-size:.72rem; color:var(--text-dim); font-weight:600; margin-top:3px; }
  .give-btn{
    padding:8px 14px; border-radius:var(--radius-pill); background:linear-gradient(135deg, var(--cream), var(--gold-strong));
    color:#241a08; font-weight:800; font-size:.78rem; display:flex; align-items:center; gap:4px; flex-shrink:0;
  }
  .give-btn.btn-disabled{ opacity:0.35; cursor:not-allowed; filter:grayscale(1); }

  .feed{ display:flex; flex-direction:column; max-height:260px; overflow-y:auto; border-radius:var(--radius-md); }
  .feed-item{ display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-bottom:1px solid var(--border-soft); }
  .feed-icon{ width:32px; height:32px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .feed-text{ flex:1; font-size:.83rem; line-height:1.45; }
  .feed-time{ font-family:var(--font-mono); font-size:.66rem; color:var(--text-faint); white-space:nowrap; }
  .feed-empty{ padding:24px 16px; text-align:center; color:var(--text-dim); font-size:.85rem; }

  .bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; justify-content:center; padding:10px 16px calc(10px + var(--safe-bottom)); pointer-events:none; }
  .nav-inner{ display:flex; gap:4px; width:100%; max-width:520px; pointer-events:auto; background:var(--surface-strong); border:1px solid var(--border); backdrop-filter: blur(24px); border-radius:var(--radius-lg); padding:6px; box-shadow:var(--shadow); }
  .nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 4px; border-radius:var(--radius-md); color:var(--text-faint); font-size:.65rem; font-weight:700; }
  .nav-btn.active{ color:var(--bg); background:var(--text); }
  .backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); z-index:90; opacity:0; pointer-events:none; transition:opacity .3s; }
  .backdrop.open{ opacity:1; pointer-events:auto; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:91; max-width:560px; margin:0 auto; background:var(--bg); border:1px solid var(--border); border-radius:26px 26px 0 0; padding:10px 20px calc(22px + var(--safe-bottom)); max-height:86vh; overflow-y:auto; transform:translateY(100%); transition: transform .4s var(--ease); }
  .sheet.open{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; border-radius:99px; background:var(--border); margin:8px auto 16px; }
  .sheet-title{ font-family:var(--font-display); font-size:1.28rem; font-weight:800; margin-bottom:12px; }
  .user-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .user-select-btn{ padding:16px; border-radius:var(--radius-md); background:var(--surface); border:1px solid var(--border); font-weight:800; text-align:center; color:var(--text); }
  .day-group{ margin-bottom:20px; }
  .day-header{ font-family:var(--font-mono); font-size:.78rem; color:var(--gold); font-weight:800; padding:6px 0; border-bottom:1px solid var(--border); margin-bottom:8px; }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 48"><rect x="8" y="13" width="24" height="27" rx="5" fill="#E8B04B"/></svg>
        <div class="brand-text">
          <h1>Milk Tracker</h1>
          <p>Family distribution</p>
        </div>
      </div>
      <div class="top-right-actions">
        <button class="user-badge-btn" id="activeUserBtn" type="button">Select User</button>
        <button class="icon-btn" id="themeToggleBtn" type="button">☀️</button>
      </div>
    </div>
    <div class="greeting-row">
      <div class="greeting">
        <h2 id="greetingText">Good morning</h2>
        <p id="greetingSub">Loading&hellip;</p>
      </div>
      <div class="day-pill" id="dayPill">&nbsp;</div>
    </div>
  </header>

  <main>
    <!-- HOME VIEW -->
    <section id="view-home" class="view active">
      <!-- Yield Banner Counter -->
      <div id="yieldBannerZone"></div>

      <!-- Scrollable Recipients List Box -->
      <section>
        <div class="section-head">
          <h3>Priority Recipients List</h3>
          <span style="font-size:.7rem;color:var(--text-dim);">Scrollable window</span>
        </div>
        <div class="card scroll-window-card">
          <div class="recipients-scroll-box" id="mainRecipientsList"></div>
        </div>
      </section>

      <!-- Activity Feed -->
      <section style="margin-top:24px;">
        <div class="section-head"><h3>Recent Activity Today</h3></div>
        <div class="card feed" id="feedList"></div>
      </section>
    </section>

    <!-- CALENDAR HISTORY VIEW -->
    <section id="view-calendar" class="view">
      <div class="section-head"><h3>Daily Ledger Calendar</h3></div>
      <div id="calendarLedger"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <div class="nav-inner">
      <button class="nav-btn active" data-tab="home" type="button"><span>Home</span></button>
      <button class="nav-btn" data-tab="calendar" type="button"><span>Calendar History</span></button>
    </div>
  </nav>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"><div class="sheet-handle"></div><div id="sheetContent"></div></div>

<script>
(function(){
  'use strict';
  var FAMILY_MEMBERS = ["Awais", "Ahad", "Amma", "Ahmad", "Daddy jee"];
  var CATEGORIES = {
    neighbors: { label:'Neighbors', rank:1, color:'#E8B04B' },
    club: { label:'Club', rank:2, color:'#6FA8DC' },
    extended_family: { label:'Extended Family', rank:3, color:'#C98BD9' },
    friends: { label:'Friends', rank:4, color:'#7FB88A' },
    extra: { label:'Extra', rank:5, color:'#6B7280' }
  };
  var DEFAULT_NAMES = ["Bablo Bhai","Nadeem Sheikh","Moin Azeem","Elahi Buksh","Moji","Club","Asif Chacha","Mona Phopho","Mithu","Mana","Usama","Baba","Rana Zeeshan","Huma","Abdul Rehman","FARHAN"];

  var recipients = JSON.parse(localStorage.getItem('milk_recipients')) || DEFAULT_NAMES.map(function(n,i){ return {id: String(i+1), name:n, category:'extra'}; });
  var activity = JSON.parse(localStorage.getItem('milk_activity')) || [];
  var currentUser = localStorage.getItem('milk_current_user') || null;

  function saveData(){
    localStorage.setItem('milk_recipients', JSON.stringify(recipients));
    localStorage.setItem('milk_activity', JSON.stringify(activity));
    if(currentUser) localStorage.setItem('milk_current_user', currentUser);
  }

  function getTodayTotalMilkCount(){
    var startOfToday = new Date().setHours(0,0,0,0);
    return activity.filter(function(a){
      return a.type === 'delivery' && a.ts >= startOfToday;
    }).length;
  }

  function lastDeliveryTs(id){
    var d = activity.filter(function(a){ return a.type==='delivery' && a.recipientId===id; }).sort(function(a,b){ return b.ts-a.ts; });
    return d.length ? d[0].ts : null;
  }

  function formatRelativeDays(ts){
    if(!ts) return "Never given";
    var startOfToday = new Date().setHours(0,0,0,0);
    var startOfDelivery = new Date(ts).setHours(0,0,0,0);
    var diffDays = Math.round((startOfToday - startOfDelivery) / (1000 * 60 * 60 * 24));
    
    if (diffDays <= 0) return "Today";
    if (diffDays === 1) return "1 day ago";
    return diffDays + " days ago";
  }

  function getRanked(){
    return recipients.slice().sort(function(a,b){
      if(CATEGORIES[a.category].rank !== CATEGORIES[b.category].rank) return CATEGORIES[a.category].rank - CATEGORIES[b.category].rank;
      var ta = lastDeliveryTs(a.id), tb = lastDeliveryTs(b.id);
      if(!ta) return -1; if(!tb) return 1; return ta - tb;
    });
  }

  function renderHeader(){
    document.getElementById('activeUserBtn').textContent = currentUser ? ("👤 " + currentUser) : "🔑 Login";
    document.getElementById('dayPill').textContent = new Date().toLocaleDateString('en-US', { month:'short', day:'numeric' });
    
    var h = new Date().getHours();
    document.getElementById('greetingText').textContent = h < 12 ? 'Good morning' : (h < 17 ? 'Good afternoon' : 'Good evening');
    
    var countToday = getTodayTotalMilkCount();
    document.getElementById('greetingSub').textContent = countToday >= 2 
      ? 'Daily limit (2/2 cans) exhausted today' 
      : (2 - countToday) + ' milk can(s) remaining for today';
  }

  function renderYieldBanner(){
    var bannerZone = document.getElementById('yieldBannerZone');
    var count = getTodayTotalMilkCount();
    var isMaxed = count >= 2;

    bannerZone.innerHTML = '<div class="yield-banner ' + (isMaxed ? 'maxed' : '') + '">' +
      '<div class="yield-text">' +
        '<h4>' + (isMaxed ? '⚠️ Daily Limit Reached' : 'Daily Milk Availability') + '</h4>' +
        '<p>' + (isMaxed ? 'Maximum 2 milk cans given today. System locked until tomorrow.' : 'Only 2 milk cans can be given out per day total.') + '</p>' +
      '</div>' +
      '<div class="yield-pill">' + count + ' / 2 Given</div>' +
    '</div>';
  }

  function renderScrollRecipientsList(){
    var scrollBox = document.getElementById('mainRecipientsList');
    var ranked = getRanked();
    var totalToday = getTodayTotalMilkCount();
    var isMaxed = totalToday >= 2;

    scrollBox.innerHTML = ranked.map(function(r, index){
      var isTop3 = index < 3;
      var lastTs = lastDeliveryTs(r.id);
      var timeFormatted = formatRelativeDays(lastTs);
      var cat = CATEGORIES[r.category];

      return '<div class="recipient-row">' +
        '<div class="recipient-info">' +
          '<div class="recipient-name-line">' +
            '<span class="recipient-name">' + r.name + '</span>' +
            (isTop3 ? '<span class="rec-badge">Recommended #' + (index + 1) + '</span>' : '') +
          '</div>' +
          '<div class="recipient-meta" style="color:' + cat.color + '">' +
            cat.label + ' &middot; Last received: <b>' + timeFormatted + '</b>' +
          '</div>' +
        '</div>' +
        '<button class="give-btn ' + (isMaxed ? 'btn-disabled' : '') + '" onclick="appGiveMilk(\'' + r.id + '\')" ' + (isMaxed ? 'disabled' : '') + '>' +
          '🥛 Give Milk' +
        '</button>' +
      '</div>';
    }).join('');
  }

  function renderFeed(){
    var el = document.getElementById('feedList');
    var startOfToday = new Date().setHours(0,0,0,0);
    var todayItems = activity.filter(function(a){ return a.ts >= startOfToday; }).sort(function(a,b){ return b.ts - a.ts; });
    
    el.innerHTML = todayItems.map(function(a){
      var r = recipients.find(function(x){ return x.id === a.recipientId; });
      return '<div class="feed-item"><div class="feed-icon">🥛</div><div class="feed-text"><b>' + (a.givenBy || 'Family member') + '</b> gave milk to <b>' + (r ? r.name : 'Someone') + '</b></div><div class="feed-time">' + new Date(a.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) + '</div></div>';
    }).join('') || '<div class="feed-empty">No milk given out yet today</div>';
  }

  function renderCalendar(){
    var ledger = document.getElementById('calendarLedger');
    var grouped = {};
    activity.filter(function(a){ return a.type==='delivery'; }).forEach(function(a){
      var dateKey = new Date(a.ts).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' });
      if(!grouped[dateKey]) grouped[dateKey] = [];
      grouped[dateKey].push(a);
    });
    var keys = Object.keys(grouped).sort(function(a,b){ return new Date(b)-new Date(a); });
    if(!keys.length){ ledger.innerHTML = '<div class="feed-empty">No past distribution history recorded yet.</div>'; return; }
    
    ledger.innerHTML = keys.map(function(dateStr){
      var logs = grouped[dateStr].map(function(l){
        var r = recipients.find(function(x){ return x.id === l.recipientId; });
        return '<div class="feed-item"><div class="feed-text"><b>' + (r ? r.name : 'Unknown') + '</b> received milk (Logged by: <b>' + (l.givenBy || 'Unknown') + '</b>)</div><div class="feed-time">' + new Date(l.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) + '</div></div>';
      }).join('');
      return '<div class="day-group"><div class="day-header">' + dateStr + '</div><div class="card feed">' + logs + '</div></div>';
    }).join('');
  }

  window.appGiveMilk = function(id){
    if(!currentUser){ promptLogin(); return; }
    if(getTodayTotalMilkCount() >= 2){ alert('Daily limit reached! Only 2 cans of milk can be given out per day.'); return; }
    
    var r = recipients.find(function(x){ return x.id === id; });
    activity.push({ id: String(Date.now()), type:'delivery', recipientId:id, givenBy:currentUser, ts:Date.now() });
    saveData();
    renderAll();
  };

  function promptLogin(){
    var sheet = document.getElementById('sheet');
    var backdrop = document.getElementById('backdrop');
    var content = document.getElementById('sheetContent');
    content.innerHTML = '<h2 class="sheet-title">Who is using the app?</h2><div class="user-grid">' +
      FAMILY_MEMBERS.map(function(m){ return '<button class="user-select-btn" onclick="selectUser(\'' + m + '\')">' + m + '</button>'; }).join('') +
      '</div>';
    backdrop.classList.add('open'); sheet.classList.add('open');
  }

  window.selectUser = function(name){
    currentUser = name;
    saveData();
    document.getElementById('sheet').classList.remove('open');
    document.getElementById('backdrop').classList.remove('open');
    renderAll();
  };

  function renderAll(){ 
    renderHeader(); 
    renderYieldBanner(); 
    renderScrollRecipientsList(); 
    renderFeed(); 
    renderCalendar(); 
  }

  document.getElementById('activeUserBtn').addEventListener('click', promptLogin);
  document.querySelectorAll('.nav-btn').forEach(function(b){
    b.addEventListener('click', function(){
      var tab = this.getAttribute('data-tab');
      document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
      document.querySelectorAll('.nav-btn').forEach(function(n){ n.classList.remove('active'); });
      document.getElementById('view-' + tab).classList.add('active');
      this.classList.add('active');
    });
  });

  renderAll();
})();
</script>
</body>
</html>
